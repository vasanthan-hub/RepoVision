spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/repovision}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:repovision_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ChangeThisPassword123!}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true